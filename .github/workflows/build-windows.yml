name: Compilar Auto Gain (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Configurar (CMake + Visual Studio 2022)
        run: cmake -S . -B build -A x64 -DAUTOGAIN_BUILD_TESTS=ON

      - name: Compilar plugin VST3 e teste
        run: cmake --build build --config Release --parallel

      - name: Teste 1 - motor de audio (13 verificacoes)
        run: .\build\Release\EngineTest.exe

      - name: Teste 2 - pluginval (validacao do VST3, nivel 5)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $vst3 = "build\AutoGain_artefacts\Release\VST3\Auto Gain.vst3"
          # pluginval e um app de janela: Start-Process -Wait garante esperar o fim e ler o codigo de saida certo
          $p = Start-Process -FilePath ".\pluginval\pluginval.exe" -Wait -PassThru -NoNewWindow `
                 -ArgumentList @("--strictness-level", "5", "--validate-in-process", "--output-dir", "pluginval-logs", "`"$vst3`"")
          Get-ChildItem pluginval-logs -Filter *.txt -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
          if ($p.ExitCode -ne 0) { Write-Error "pluginval reprovou o plugin (codigo $($p.ExitCode))"; exit 1 }
          Write-Host "pluginval: APROVADO"

      - name: Montar pacote de instalacao
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\AutoGain | Out-Null
          Copy-Item -Recurse "build\AutoGain_artefacts\Release\VST3\Auto Gain.vst3" "dist\AutoGain\"
          Copy-Item INSTALAR.txt dist\AutoGain\
          Copy-Item INSTALAR.txt dist\
          Compress-Archive -Path dist\AutoGain\* -DestinationPath dist\AutoGain-Windows-x64.zip

      - name: Guardar pacote (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: AutoGain-Windows-x64
          path: |
            dist/AutoGain-Windows-x64.zip
            pluginval-logs/
          if-no-files-found: error

      - name: Publicar na pagina de downloads (Releases)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.0"
          $notes = "Auto Gain by Augusto Souza - build automatico de ${{ github.sha }}. Testes: motor de audio OK + pluginval nivel 5 OK."
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist\AutoGain-Windows-x64.zip dist\INSTALAR.txt --title "Auto Gain v1.0.0" --notes "$notes" --latest
          } else {
            gh release upload $tag dist\AutoGain-Windows-x64.zip dist\INSTALAR.txt --clobber
            gh release edit $tag --notes "$notes"
          }
